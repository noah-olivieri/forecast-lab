name: drivers-setup
description: >
  Check out nfl-drivers next to forecast-lab, install R at the version pinned in its renv.lock,
  restore the pinned packages (cached), restore the 2006-2025 nflverse cache, and sync
  forecast-lab's Python environment. Expects forecast-lab checked out at ./forecast-lab.

runs:
  using: composite
  steps:
    # Sibling of ./forecast-lab, never inside it: each repo's clean-tree check would see the
    # other as untracked files.
    - uses: actions/checkout@v7
      with:
        repository: noah-olivieri/nfl-drivers
        ref: master
        path: nfl-drivers

    - id: rver
      shell: bash
      run: |
        echo "version=$(python3 -c "import json; print(json.load(open('nfl-drivers/renv.lock'))['R']['Version'])")" >> "$GITHUB_OUTPUT"
        . /etc/os-release
        # renv installs from the lockfile's repos unless overridden; Posit's Linux binaries
        # keep a cache miss to minutes.
        echo "RENV_CONFIG_REPOS_OVERRIDE=https://packagemanager.posit.co/cran/__linux__/${VERSION_CODENAME}/latest" >> "$GITHUB_ENV"

    - uses: r-lib/actions/setup-r@v2.9.0
      with:
        r-version: ${{ steps.rver.outputs.version }}
        use-public-rspm: true

    - uses: r-lib/actions/setup-renv@v2.9.0
      with:
        working-directory: nfl-drivers
        cache-version: 1

    # Past seasons only. 2026 is never restored: run.R always re-downloads the current season
    # and stops if that fails, so cached data can't make a snapshot stale.
    - uses: actions/cache@v6.1.0
      with:
        path: |
          nfl-drivers/data/cache/pbp_200[6-9].rds
          nfl-drivers/data/cache/pbp_201[0-9].rds
          nfl-drivers/data/cache/pbp_202[0-5].rds
          nfl-drivers/data/cache/schedules_2009.rds
          nfl-drivers/data/cache/schedules_201[0-9].rds
          nfl-drivers/data/cache/schedules_202[0-5].rds
        key: nflverse-2006-2025-v1

    # forecast-lab's real-R exporter tests run Rscript from forecast-lab's directory (outside
    # nfl-drivers' renv), so jsonlite must also be in the default library.
    - shell: bash
      working-directory: forecast-lab
      run: Rscript -e 'install.packages("jsonlite")'

    - uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
        cache-dependency-glob: forecast-lab/uv.lock

    - shell: bash
      working-directory: forecast-lab
      run: uv sync --frozen

    # renv setup must not touch tracked files (e.g. rewrite renv/activate.R): run.R would record
    # code_dirty and every snapshot would be refused. Fail here, where the cause is visible.
    - shell: bash
      run: |
        dirty="$(git -C nfl-drivers status --porcelain)"
        if [ -n "$dirty" ]; then
          echo "::error::nfl-drivers checkout is not clean after setup:"
          echo "$dirty"
          exit 1
        fi
