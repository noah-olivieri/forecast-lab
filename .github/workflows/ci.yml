name: ci

# Tests, lint, and a guard that forecasts/ and results/ stay append-only: no commit may modify or
# delete an existing forecast or result file (adding new ones is fine). The forecast proof
# (PLAN 7a) and the settled outcomes depend on it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check .
      - name: forecasts/ and results/ are append-only
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .github/scripts/check_forecasts_append_only.sh "$BASE" HEAD
