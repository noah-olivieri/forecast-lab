name: ci

# Tests, lint, and a guard that forecasts/ and results/ stay append-only: no commit may modify or
# delete an existing forecast or result file (adding new ones is fine). The forecast proof
# (PLAN 7a) and the settled outcomes depend on it. The guard checks the whole history of HEAD on
# every run, not the push range: bot pushes made with GITHUB_TOKEN trigger no CI run, so a range
# starting at the previous tip would never cover the bot's own commits.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check .
      - name: forecasts/, results/ and drivers_snapshots/ are append-only (whole history)
        run: .github/scripts/check_forecasts_append_only.sh "" HEAD
