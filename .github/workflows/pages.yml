name: pages

# Builds site/data/*.json (jobs/build_site.py) and deploys site/ to GitHub Pages on every push to
# main, so a forecast push updates the site too. The build reads the `data` branch with
# `git show`, so it needs the full history (fetch-depth: 0): that also lets it find the commit
# that first added each forecast CSV for the commit links. Market prices are as of the build, so
# an hourly run at :50 (the collector's :05 snapshot is long saved by then) keeps them fresh.
# Scheduled runs use the default branch's copy of this file, so the schedule starts once this
# file is on main.
on:
  push:
    branches: [main]
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Show the refs the build reads
        run: git rev-parse --short origin/main origin/data
      - run: uv run --no-sync python jobs/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
