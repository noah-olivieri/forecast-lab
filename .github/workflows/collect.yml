name: collect

# Hourly market snapshots -> `data` branch. The snapshotter exists (M1) but the cron stays OFF
# until the tracked-market list is approved; until then this only runs by hand.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "5 * * * *"   # enable at M1

concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: .github/scripts/data_worktree.sh create
      - name: Snapshot markets
        run: uv run --no-sync python jobs/snapshot_markets.py data-branch
      - name: Commit snapshots
        run: .github/scripts/push_data.sh "snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
