name: collect

# Market snapshots -> `data` branch.
#  * Hourly at :05, always.
#  * A `*/15` cron every day; jobs/in_window.py gates it. A run captures only if it is within 45
#    min before to 15 min after a kickoff in config/kickoffs.json (built from the real NFL
#    schedule by jobs/build_kickoffs.py, refreshed weekly by kickoffs.yml). Gate-only runs
#    finish in seconds and the repo is public, so they cost nothing. If the file is missing the
#    gate falls back to fixed Thu/Sun/Mon Pacific-time windows. GitHub may start scheduled runs
#    several minutes late; the gate allows 10 min of grace.
on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  # No concurrency group here: gate-only runs must never queue in (or cancel a pending run of)
  # the data-branch group, which keeps just one running + one pending run.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - id: gate
        run: python3 jobs/in_window.py "${{ github.event_name }}" "${{ github.event.schedule }}"

  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: data-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: .github/scripts/data_worktree.sh create
      - name: Snapshot markets
        run: uv run --no-sync python jobs/snapshot_markets.py data-branch
      - name: Commit snapshots
        run: .github/scripts/push_data.sh "snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
