[project]
name = "forecast-lab"
version = "0.1.0"
description = "Econ & Sports Forecast Lab: paper-traded forecasts vs. prediction-market prices"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb",
    "httpx",
    "tenacity",
    "polars",
    "pandas",
    "pydantic",
    "pyyaml",
    "python-dotenv",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
    "nflreadpy",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
