# Series to track. Fee type/multiplier are read from the Kalshi API, not stored here.
kalshi:
  econ:
    - KXCPI
    - KXCPIYOY
    - KXPAYROLLS
    - KXU3
    - KXFED
    - KXFEDDECISION
    - KXGDP
    - KXJOBLESSCLAIMS
    - KXAAAGASW
    - KXMORTGAGERATE
  nfl:
    - KXNFLGAME
    - KXNFLSPREAD
    - KXNFLTOTAL
snapshots:
  econ_offsets: ["7d", "1d", "1h"]
  nfl_offsets: ["24h", "1h"]
collector:
  venues: [kalshi]   # add polymarket_us when its snapshotter ships (M1)
