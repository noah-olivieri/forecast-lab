# Series to track. Fee type/multiplier are read from the Kalshi API, not stored here.
kalshi:
  econ:
    - KXCPI
    - KXCPIYOY
    - KXPAYROLLS
    - KXU3
    - KXFED
    - KXFEDDECISION
    - KXGDP
    - KXJOBLESSCLAIMS
    - KXAAAGASW
    - KXMORTGAGERATE
  nfl:
    - KXNFLGAME
    - KXNFLSPREAD
    - KXNFLTOTAL
snapshots:
  econ_offsets: ["7d", "1d", "1h"]
  nfl_offsets: ["24h", "1h"]
polymarket_us:
  # NFL: full-game winner/spread/total only. Econ: `macro` events whose title matches this regex.
  econ_title_regex: '\b(CPI|Fed Decision|GDP Growth in Q\d|Jobs|Payrolls?|Unemployment|Jobless)\b'
collector:
  venues: [kalshi, polymarket_us]   # the hourly cron itself is still off (collect.yml)
